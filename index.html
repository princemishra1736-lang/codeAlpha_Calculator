[23:21, 15/09/2026] Prince Mishra: <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalcPro - Smart Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="calculator">

            <div class="header">
                <div>
                    <h1>Calc<span>Pro</span></h1>
                    <p>Smart • Fast • Simple</p>
                </div>

                <div class="icon">+</div>
            </div>


            <div class="screen">

                <p id="expression">Ready to calculate</p>

                <input type="text" id="display" value="0" readonly>

            </div>


            <div class="buttons">

                <button class="clear" onclick="clearDisplay()">AC</button>
                <button class="delete" onclick="deleteNumber()">DEL</button>
                <button class="operator" onclick="addNumber('%')">%</button>
                <button class="operator" onclick="addNumber('/')">÷</button>

                <button onclick="addNumber('7')">7</button>
                <button onclick="addNumber('8')">8</button>
                <button onclick="addNumber('9')">9</button>
                <button class="operator" onclick="addNumber('*')">×</button>

                <button onclick="addNumber('4')">4</button>
                <button onclick="addNumber('5')">5</button>
                <button onclick="addNumber('6')">6</button>
                <button class="operator" onclick="addNumber('-')">−</button>

                <button onclick="addNumber('1')">1</button>
                <button onclick="addNumber('2')">2</button>
                <button onclick="addNumber('3')">3</button>
                <button class="operator" onclick="addNumber('+')">+</button>

                <button class="zero" onclick="addNumber('0')">0</button>
                <button onclick="addNumber('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>

            </div>


            <div class="footer">
                <span>CALCPRO v1.0</span>
                <span>● Ready</span>
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
